<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Subscriptions Dashboard</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <header class="topbar">
    <h1>Subscriptions Dashboard</h1>
    <div class="auth-area">
      <span id="syncStatus"></span>
      <button id="manageChannelsBtn" hidden>Manage channels</button>
      <button id="signInBtn">Sign in with Google</button>
      <button id="signOutBtn" hidden>Sign out</button>
      <button id="refreshBtn" hidden>Refresh now</button>
    </div>
  </header>

  <main id="app" hidden>
    <aside class="groups-panel">
      <h2>Groups</h2>
      <ul id="groupList"></ul>
      <form id="newGroupForm">
        <input id="newGroupName" placeholder="New group name" required />
        <button type="submit">Add group</button>
      </form>

      <h2>Assign channels</h2>
      <div id="channelAssignList" class="channel-assign-list"></div>
    </aside>

    <section class="feed-panel">
      <div class="feed-controls">
        <label>Type:
          <select id="filterType">
            <option value="all">All</option>
            <option value="video">Video</option>
            <option value="short">Short</option>
            <option value="live">Live</option>
          </select>
        </label>
        <label>Length:
          <select id="filterDuration">
            <option value="any">Any</option>
            <option value="under4">&lt; 4 min</option>
            <option value="4to20">4&ndash;20 min</option>
            <option value="over20">&gt; 20 min</option>
          </select>
        </label>
        <label>Uploaded:
          <select id="filterUploaded">
            <option value="any">Any time</option>
            <option value="today">Today</option>
            <option value="week">This week</option>
            <option value="month">This month</option>
          </select>
        </label>
        <label>Sort:
          <select id="sortBy">
            <option value="date">Newest</option>
            <option value="duration">Duration</option>
            <option value="views">Most viewed</option>
          </select>
        </label>
        <label><input type="checkbox" id="hideWatched" /> Hide watched</label>
        <input id="searchQuery" type="search" placeholder="Search title or channel" />
      </div>
      <div id="feed" class="feed"></div>
    </section>
  </main>

  <script src="feedFilter.js"></script>
  <script src="channelHealth.js"></script>
  <script src="dashboard.js" type="module"></script>
</body>
</html>
