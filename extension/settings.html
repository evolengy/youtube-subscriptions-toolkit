<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Settings</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <header class="topbar">
    <h1>Settings</h1>
    <span id="hint">Changes apply to youtube.com right away. Reload the tab if a section lingers.</span>
  </header>

  <main class="page">
    <section class="group">
      <h2>Hide sections of YouTube's left menu</h2>
      <p class="note">
        Each toggle hides that block of youtube.com's own sidebar. Sections that
        aren't shown on your account are simply skipped.
      </p>
      <ul id="guideToggles" class="toggles"></ul>
    </section>
  </main>

  <script src="settings.js" type="module"></script>
</body>
</html>
