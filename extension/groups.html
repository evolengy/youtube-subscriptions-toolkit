<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Group editor</title>
  <link rel="stylesheet" href="groups.css" />
  <link rel="stylesheet" href="emojiPicker.css" />
</head>
<body>
  <header class="topbar">
    <h1>Group editor</h1>
    <span id="hint">Click a group in the rail to filter. Click a channel's group chip to add or remove it.</span>
  </header>

  <main id="app" hidden>
    <aside class="rail">
      <div id="railFilters"></div>
      <div class="rail-sep"></div>
      <div id="railGroups"></div>
      <button type="button" id="newGroupBtn" class="rail-new">＋ New group</button>
    </aside>

    <section class="pane">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search channel" />
      </div>
      <div id="list" class="channel-list"></div>
      <p id="empty" hidden>No channels match.</p>
    </section>
  </main>

  <p id="signedOut" hidden>Sign in from the dashboard first.</p>

  <script src="groupEditor.js"></script>
  <script src="emojiData.js"></script>
  <script src="emojiPicker.js"></script>
  <script src="groups.js" type="module"></script>
</body>
</html>
