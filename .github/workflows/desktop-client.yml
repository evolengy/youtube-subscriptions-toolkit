name: desktop-client

on:
  push:
    branches: [main]
    paths:
      - "desktop-client/**"
      - ".github/workflows/desktop-client.yml"
  pull_request:
    paths:
      - "desktop-client/**"
      - ".github/workflows/desktop-client.yml"
  workflow_dispatch:

jobs:
  test:
    # net10.0-windows (WPF + WinForms) only builds on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test --configuration Release
        working-directory: desktop-client
