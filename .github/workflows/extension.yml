name: extension

on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/extension.yml"
  pull_request:
    paths:
      - "extension/**"
      - ".github/workflows/extension.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Pure-logic modules, Node's built-in runner, no dependencies to install.
      # spec reporter = one readable ✔/✖ line per test in the job log.
      - run: node --test --test-reporter=spec
        working-directory: extension
